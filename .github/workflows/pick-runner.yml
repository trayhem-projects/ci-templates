name: Pick Runner

on:
  workflow_call:
    inputs:
      org:
        required: true
        type: string
    outputs:
      labels_json:
        description: "JSON array for runs-on, e.g. [\"self-hosted\",\"primary\"]"
        value: ${{ jobs.pick.outputs.labels_json }}

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      labels_json: ${{ steps.check.outputs.labels_json }}
    steps:
      - id: check
        env:
          ORG: ${{ inputs.org }}
        run: |
          LABEL=$(curl -s "https://raw.githubusercontent.com/$ORG/ci-templates/main/status/$ORG.json" | jq -r '.label // "fallback"')
          echo "picked $LABEL"
          echo "labels_json=[\"self-hosted\",\"$LABEL\"]" >> "$GITHUB_OUTPUT"
